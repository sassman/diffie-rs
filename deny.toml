# cargo-deny policy, run by `just ci-check`.

[advisories]
# GPUI's snapshot tree drags in several unmaintained crates this project
# cannot replace; only a direct dependency going unmaintained is ours to act
# on. Vulnerabilities still fail the check wherever they sit.
unmaintained = "workspace"

[licenses]
# Permissive licenses only. The one weak-copyleft entry (MPL) is linked, not
# vendored, which its terms allow without further obligations.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# The workspace's own crates are unpublished, so the check skips them; the
# project itself is MIT.
private = { ignore = true }

[sources]
# The owner's Kit fork, the one sanctioned [patch.crates-io] exception.
allow-git = ["https://github.com/sassman/gpui-kit"]
