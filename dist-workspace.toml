[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Homebrew tap repository
tap = "sassman/homebrew-tap"
# Publish jobs to run
publish-jobs = ["homebrew"]
# Don't publish prereleases to Homebrew
publish-prereleases = false
# release.yml is customized (GitHub App auth for the tap) - don't overwrite
allow-dirty = ["ci"]

# GitHub retired the macos-14 label that dist defaults to for Apple Silicon;
# pin the arm64 runner to the same image generation as dist's macos-15-intel.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# What GPUI links against on Linux; the README lists the same packages.
[dist.dependencies.apt]
gcc = "*"
"g++" = "*"
clang = "*"
libfontconfig-dev = "*"
libwayland-dev = "*"
libxkbcommon-x11-dev = "*"
libx11-xcb-dev = "*"
libssl-dev = "*"
libzstd-dev = "*"
libasound2-dev = "*"
