[workspace]
resolver = "2"
members = ["crates/core", "crates/symbols", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/sassman/diffie-rs"
homepage = "https://github.com/sassman/diffie-rs"
# Releases ship as GitHub Release binaries and a Homebrew formula, not
# through crates.io.
publish = false

[workspace.dependencies]
diffie-core = { path = "crates/core" }
diffie-symbols = { path = "crates/symbols" }
# The versions the Kit builds its own highlighting on, so the lock holds
# one copy once that feature is switched on. The Kit does not re-export
# `tree_sitter`, hence the direct dependency.
tree-sitter = "0.26.13"
tree-sitter-rust = "0.24.0"
# GPUI Kit re-exports GPUI and pins the matching GPUI snapshot itself.
# Pin exactly: every Kit release may move to a GPUI snapshot with API changes.
gpui-kit = { version = "=0.9.1", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# The user's config directory. favor-xdg-style keeps the `~/.config`
# spelling on macOS too - the owner wants one place across machines.
dirs-lite = { version = "1", features = ["favor-xdg-style"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The owner's Kit fork until longbridge/gpui-kit takes the PRs. The
# branch stacks the fork's diff features (bulk collapse, per-panel split
# scrolling, pinned file headers, labeled fold rows) on the v0.9.1 tag,
# so every crate keeps the pinned version; the whole family must come
# from one source or two copies of gpui-base collide.
[patch.crates-io]
# LOCAL ONLY, not to land: `diff-text-pointer` is `sticky-file-headers`
# plus the text pointer events symbol navigation needs, and is not pushed
# yet. Once it is on GitHub these four lines go back to the GitHub URL.
gpui-kit = { git = "file:///Users/d34dl0ck/workspaces/diffie/gpui-kit", branch = "diff-text-pointer" }
gpui-component = { git = "file:///Users/d34dl0ck/workspaces/diffie/gpui-kit", branch = "diff-text-pointer" }
gpui-base = { git = "file:///Users/d34dl0ck/workspaces/diffie/gpui-kit", branch = "diff-text-pointer" }
gpui-kit-assets = { git = "file:///Users/d34dl0ck/workspaces/diffie/gpui-kit", branch = "diff-text-pointer" }

[profile.dev]
# GPUI is slow unoptimised; keep our own crates fast to rebuild.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

# What `dist` builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
