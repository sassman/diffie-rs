[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
diffie-core = { path = "crates/core" }
# GPUI Kit re-exports GPUI and pins the matching GPUI snapshot itself.
# Pin exactly: every Kit release may move to a GPUI snapshot with API changes.
gpui-kit = { version = "=0.9.1", features = ["syntect"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"

# The owner's Kit fork, carrying `DiffState::set_all_files_collapsed`
# until longbridge/gpui-kit takes the PR. The branch sits on the v0.9.1
# tag, so every crate keeps the pinned version; the whole family must
# come from one source or two copies of gpui-base collide.
[patch.crates-io]
gpui-kit = { git = "https://github.com/sassman/gpui-kit", branch = "split-panel-scroll" }
gpui-component = { git = "https://github.com/sassman/gpui-kit", branch = "split-panel-scroll" }
gpui-base = { git = "https://github.com/sassman/gpui-kit", branch = "split-panel-scroll" }
gpui-kit-assets = { git = "https://github.com/sassman/gpui-kit", branch = "split-panel-scroll" }

[profile.dev]
# GPUI is slow unoptimised; keep our own crates fast to rebuild.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
